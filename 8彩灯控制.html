<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC 彩灯控制（8灯）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 16px;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 30% 20%, #2b313c 0%, #171b21 70%, #0e1116 100%);
    color: #e8ecf1;
  }

  h1 {
    font-size: 26px;
    letter-spacing: 2px;
    margin-bottom: 6px;
    color: #f5f7fa;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .subtitle {
    font-size: 13px;
    color: #9aa5b1;
    margin-bottom: 26px;
    letter-spacing: 1px;
  }

  /* ===== PLC 面板 ===== */
  .panel {
    position: relative;
    width: min(880px, 96vw);
    background: linear-gradient(145deg, #4a4f57 0%, #3a3e45 45%, #33373d 100%);
    border-radius: 18px;
    padding: 28px 28px 30px;
    box-shadow:
      0 18px 40px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -2px 6px rgba(0,0,0,.45);
    border: 1px solid #5b616b;
  }

  /* 面板螺丝 */
  .screw {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfd3da, #6b7078 60%, #494d54);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,.6), 0 1px 1px rgba(255,255,255,.25);
  }
  .screw::after {
    content: "";
    position: absolute;
    left: 3px; right: 3px; top: 7px;
    height: 2px;
    background: #33363c;
    transform: rotate(-45deg);
    border-radius: 1px;
  }
  .screw.tl { top: 10px; left: 10px; }
  .screw.tr { top: 10px; right: 10px; }
  .screw.bl { bottom: 10px; left: 10px; }
  .screw.br { bottom: 10px; right: 10px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .brand .logo {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: linear-gradient(135deg, #22c1ff, #7c4dff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
    box-shadow: 0 4px 12px rgba(34,193,255,.35);
  }
  .brand .name { font-size: 15px; font-weight: 600; color: #f0f3f7; letter-spacing: 1px; }
  .brand .model { font-size: 11px; color: #aeb6c0; margin-top: 2px; letter-spacing: 2px; }

  /* ===== 8 个彩灯 ===== */
  .lights {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
    background: linear-gradient(180deg, #2c3036, #262a30);
    border-radius: 12px;
    padding: 18px 14px;
    border: 1px solid #1b1e23;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.08);
    margin-bottom: 20px;
  }

  .light {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .light .num {
    font-size: 12px;
    font-weight: 600;
    color: #cfd6de;
    background: #1f2328;
    border: 1px solid #3a4048;
    border-radius: 5px;
    padding: 2px 9px;
  }
  .led {
    width: 58px; height: 58px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3c414a 0%, #23272d 55%, #181b20 100%);
    box-shadow:
      inset 0 -6px 10px rgba(0,0,0,.7),
      inset 0 4px 8px rgba(255,255,255,.08),
      0 3px 6px rgba(0,0,0,.5);
    border: 2px solid #4c525b;
    transition: all .18s ease;
    cursor: pointer;
  }
  .led.on {
    background: radial-gradient(circle at 35% 30%, #fff 0%, var(--c) 45%, color-mix(in srgb, var(--c) 65%, #000) 100%);
    border-color: color-mix(in srgb, var(--c) 80%, #fff);
    box-shadow:
      inset 0 -4px 8px rgba(0,0,0,.35),
      inset 0 3px 6px rgba(255,255,255,.55),
      0 0 22px var(--c),
      0 0 44px color-mix(in srgb, var(--c) 45%, transparent);
    animation: glow 1.4s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { filter: brightness(.92); }
    to   { filter: brightness(1.15); }
  }
  .light .addr {
    font-size: 11px;
    color: #8e98a4;
    letter-spacing: .5px;
    font-family: Consolas, "Courier New", monospace;
  }
  .light .addr.on-addr { color: var(--c); font-weight: 700; text-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); }

  /* ===== 状态区 ===== */
  .status {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .status .box {
    flex: 1;
    min-width: 200px;
    background: #1b1f24;
    border: 1px solid #333941;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
  }
  .status .box .k { color: #87929e; margin-right: 8px; }
  .status .box .v { font-family: Consolas, monospace; color: #ffe082; font-weight: 600; }
  .status .box .v.err { color: #ff6b6b; }
  .status .bin {
    background: #101318;
    border: 1px solid #2c3138;
    border-radius: 8px;
    padding: 10px 16px;
    font-family: Consolas, monospace;
    font-size: 17px;
    letter-spacing: 2px;
    color: #66717d;
    white-space: nowrap;
  }
  .status .bin b { color: #22c1ff; font-weight: 700; }

  /* ===== 控制区 ===== */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .controls .input-group { display: flex; flex-direction: column; gap: 6px; }
  .controls label { font-size: 12px; color: #9aa5b1; }
  .controls input {
    width: 90px;
    padding: 9px 10px;
    font-size: 18px;
    font-family: Consolas, monospace;
    text-align: center;
    background: #171b20;
    border: 1px solid #3a4048;
    border-radius: 8px;
    color: #eaf2ff;
    outline: none;
  }
  .controls input:focus { border-color: #22c1ff; box-shadow: 0 0 0 3px rgba(34,193,255,.18); }

  .btn {
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: #fff;
    transition: transform .08s ease, box-shadow .15s ease, filter .15s;
    letter-spacing: 1px;
  }
  .btn:active { transform: translateY(1px); }
  .btn.run  { background: linear-gradient(135deg, #22c1ff, #0f86d6); box-shadow: 0 4px 14px rgba(34,193,255,.4); }
  .btn.run:hover { filter: brightness(1.1); }
  .btn.res  { background: linear-gradient(135deg, #5b6b7a, #3d4854); box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .btn.res:hover { filter: brightness(1.12); }

  /* 数字键盘 */
  .keypad {
    display: flex;
    gap: 6px;
    margin-left: auto;
    flex-wrap: wrap;
  }
  .keypad button {
    width: 40px; height: 40px;
    border-radius: 8px;
    border: 1px solid #3a4048;
    background: linear-gradient(180deg, #2b3037, #22262c);
    color: #dbe3ec;
    font-size: 16px;
    font-weight: 700;
    font-family: Consolas, monospace;
    cursor: pointer;
    transition: all .08s ease;
  }
  .keypad button:hover { background: linear-gradient(180deg, #38404a, #2a3038); border-color: #22c1ff; color: #22c1ff; }
  .keypad button:active { transform: scale(.94); }

  footer {
    margin-top: 18px;
    font-size: 12px;
    color: #6b7480;
    text-align: center;
    line-height: 1.8;
  }
  footer code { color: #8fa3b5; background: #22262c; padding: 2px 6px; border-radius: 4px; font-size: 11px; }

  @media (max-width: 720px) {
    .lights { grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .led { width: 52px; height: 52px; }
    .keypad { margin-left: 0; }
  }
</style>
</head>
<body>
  <h1>PLC 彩灯控制</h1>
  <div class="subtitle">8 路彩灯 · 输入数字点亮对应彩灯</div>

  <div class="panel">
    <span class="screw tl"></span><span class="screw tr"></span>
    <span class="screw bl"></span><span class="screw br"></span>

    <div class="brand">
      <div class="logo">PLC</div>
      <div>
        <div class="name">彩灯控制单元</div>
        <div class="model">LAMP CONTROL · 8 CH</div>
      </div>
    </div>

    <div class="lights" id="lights"></div>

    <div class="status">
      <div class="box"><span class="k">当前输入</span><span class="v" id="curInput">--</span></div>
      <div class="box"><span class="k">点亮输出</span><span class="v" id="curOut">--</span></div>
      <div class="box"><span class="k">提示</span><span class="v" id="hint">请输入 1~8 的数字</span></div>
      <div class="bin" id="bin">QB0 = <b>00000000</b>b</div>
    </div>

    <div class="controls">
      <div class="input-group">
        <label for="numInput">输入数字 (1~8)</label>
        <input type="text" id="numInput" inputmode="numeric" maxlength="1" placeholder="1~8">
      </div>
      <button class="btn run" id="btnRun">点 亮</button>
      <button class="btn res" id="btnRes">复 位</button>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>

  <footer>
    仿真说明：输入数字 <code>1~8</code> 后点击「点亮」（或直接按键盘数字键 / 点击键盘），对应的彩灯点亮；<br>
    对应 PLC 输出位 <code>Q0.0 ~ Q0.7</code>，二进制显示为输出字节 <code>QB0</code> 的值。
  </footer>

<script>
  const COLORS = ['#ff5252', '#ff8f3c', '#ffd740', '#69f0ae', '#22c1ff', '#448aff', '#7c4dff', '#ff5ec4'];

  const lightsBox = document.getElementById('lights');
  const numInput  = document.getElementById('numInput');
  const keypad    = document.getElementById('keypad');
  const curInput  = document.getElementById('curInput');
  const curOut    = document.getElementById('curOut');
  const hint      = document.getElementById('hint');
  const binB      = document.querySelector('#bin b');

  // 生成 8 个彩灯
  for (let i = 0; i < 8; i++) {
    const div = document.createElement('div');
    div.className = 'light';
    div.innerHTML = `
      <span class="num">${i + 1}</span>
      <div class="led" data-n="${i + 1}" style="--c:${COLORS[i]}"></div>
      <span class="addr" data-a="${i + 1}">Q0.${i}</span>`;
    lightsBox.appendChild(div);
  }

  // 生成数字键盘 1~8
  for (let n = 1; n <= 8; n++) {
    const b = document.createElement('button');
    b.textContent = n;
    b.addEventListener('click', () => lightOn(n));
    keypad.appendChild(b);
  }

  const leds = document.querySelectorAll('.led');
  const addrs = document.querySelectorAll('.addr');

  function lightOn(n) {
    leds.forEach((led, i) => {
      const on = (i === n - 1);
      led.classList.toggle('on', on);
      addrs[i].classList.toggle('on-addr', on);
    });
    curInput.textContent = n;
    curOut.textContent = `Q0.${n - 1}（第 ${n} 号灯）`;
    curOut.classList.remove('err');
    hint.textContent = '运行中：灯 ' + n + ' 已点亮';
    hint.classList.remove('err');
    // QB0 二进制（D0 对应 1 号灯）
    let bits = '';
    for (let i = 7; i >= 0; i--) bits += (i === n - 1) ? '1' : '0';
    binB.textContent = bits;
  }

  function resetAll() {
    leds.forEach(led => led.classList.remove('on'));
    addrs.forEach(a => a.classList.remove('on-addr'));
    curInput.textContent = '--';
    curOut.textContent = '--';
    hint.textContent = '请输入 1~8 的数字';
    hint.classList.remove('err');
    curOut.classList.remove('err');
    binB.textContent = '00000000';
    numInput.value = '';
  }

  // 校验输入：仅接受 1~8
  function parseInput() {
    const v = numInput.value.trim();
    if (v === '') { hint.textContent = '请输入 1~8 的数字'; hint.classList.remove('err'); return; }
    const n = Number(v);
    if (!Number.isInteger(n) || n < 1 || n > 8) {
      hint.textContent = '输入无效：请输入 1~8 之间的整数';
      hint.classList.add('err');
      return;
    }
    lightOn(n);
  }

  document.getElementById('btnRun').addEventListener('click', parseInput);
  document.getElementById('btnRes').addEventListener('click', resetAll);

  // 回车确认
  numInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') parseInput();
  });

  // 键盘直接点亮：数字键 1~8
  document.addEventListener('keydown', e => {
    if (/^[1-8]$/.test(e.key)) lightOn(Number(e.key));
  });
</script>
</body>
</html>
